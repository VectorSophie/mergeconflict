services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mergeconflict
      POSTGRES_PASSWORD: mergeconflict
      POSTGRES_DB: mergeconflict
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mergeconflict -d mergeconflict"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
